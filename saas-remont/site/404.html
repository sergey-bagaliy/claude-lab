<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Ремонт под контролем</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f9; color: #142030; display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; text-align: center; }
    a { display: inline-block; margin-top: 12px; background: #c2410c; color: #fff; padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела.</p>
    <a id="home" href="./">На главную</a>
  </main>
  <script>
    // На GitHub Pages сайт может открываться из подпапки репозитория — ведём на её корень
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      if (location.hostname.endsWith("github.io") && parts.length) {
        document.getElementById("home").href = "/" + parts[0] + "/";
      }
    })();
  </script>
</body>
</html>
