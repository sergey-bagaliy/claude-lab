# ─────────────────────────────────────────────────────────────────────────────
# Конфиг ИИ-администратора: АВТОСЕРВИС (пример)
#
# ВНИМАНИЕ: автосервис вымышленный, все данные ниже — ЗАГЛУШКИ.
# Замените название, адрес, телефон, услуги, цены, FAQ и тексты на реальные.
# Бот отвечает ТОЛЬКО тем, что написано здесь.
# ─────────────────────────────────────────────────────────────────────────────

business:
  name: "Автосервис «Пример»"
  niche: "автосервис и шиномонтаж"
  address: "г. Краснодар, ул. Примерная, д. 0 (замените на реальный адрес)"
  phone: "+7 (000) 000-00-00"
  website: ""
  privacy_policy_url: "https://example.com/privacy"
  operator: "ИП Пример П. П. (замените), ИНН 000000000000"
  consent_text: ""

assistant:
  name: "Максим"
  tone: "дружелюбно, по делу и коротко, обращайся на «вы»"
  greeting: >-
    Здравствуйте! Я Максим, виртуальный администратор автосервиса «Пример».
    Подскажу по услугам и запишу на удобное время. Напишите вопрос или нажмите «📅 Записаться».
  rules:
    - "Не называй точную стоимость ремонта без диагностики: итоговую цену мастер назовёт после осмотра."
    - "Перед записью уточни марку, модель и год автомобиля — передай это в поле comment."
    - "Если машина не на ходу или нужен эвакуатор — передай вопрос администратору (handoff_to_admin)."

booking:
  # Дополнительный вопрос перед записью — ответ попадёт владельцу в заявке.
  comment_prompt: "Укажите марку, модель и год автомобиля"

schedule:
  timezone: "Europe/Moscow"
  slot_step_minutes: 30
  booking_horizon_days: 10
  min_lead_minutes: 60
  capacity: 2                   # два подъёмника — можно принять две машины одновременно
  working_hours:
    mon: "08:00-20:00"
    tue: "08:00-20:00"
    wed: "08:00-20:00"
    thu: "08:00-20:00"
    fri: "08:00-20:00"
    sat: "09:00-18:00"
    sun: "10:00-16:00"
  breaks: []
  days_off:
    - "2027-01-01"

services:
  - id: diagnostics
    name: "Компьютерная диагностика"
    duration_minutes: 30
    price: ""                   # например: "от 1 000 ₽"
  - id: oil
    name: "Замена масла и фильтра"
    duration_minutes: 30
    price: ""
  - id: tires
    name: "Шиномонтаж (4 колеса)"
    duration_minutes: 60
    price: ""
  - id: suspension
    name: "Диагностика подвески"
    duration_minutes: 30
    price: ""
  - id: brakes
    name: "Замена тормозных колодок"
    duration_minutes: 60
    price: ""
    description: "Стоимость зависит от модели авто и запчастей."

faq:
  - q: "Можно ли со своими запчастями?"
    a: "ЗАМЕНИТЕ: опишите ваши правила работы с запчастями клиента."
  - q: "Сколько ждать?"
    a: "Время работ указано у каждой услуги; если найдём что-то ещё — мастер сначала согласует с вами."
  - q: "Как отменить или перенести запись?"
    a: "Нажмите «🗓 Мои записи» и отмените запись, затем запишитесь на новое время. Или позвоните нам."

knowledge: |
  ЗАМЕНИТЕ этот блок своими данными: какие марки обслуживаете, гарантия на работы,
  есть ли зона ожидания, способы оплаты, как проехать, сезонная запись на шиномонтаж и т. п.
