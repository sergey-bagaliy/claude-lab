# ─────────────────────────────────────────────────────────────────────────────
# Конфиг ИИ-администратора: СТОМАТОЛОГИЯ (пример)
#
# ВНИМАНИЕ: клиника вымышленная, все данные ниже — ЗАГЛУШКИ.
# Перед запуском замените название, адрес, телефон, услуги, цены, FAQ и тексты
# на реальные данные клиники. Бот отвечает ТОЛЬКО тем, что написано здесь.
# ─────────────────────────────────────────────────────────────────────────────

business:
  name: "Стоматология «Пример»"
  niche: "стоматологическая клиника"
  address: "г. Краснодар, ул. Примерная, д. 0 (замените на реальный адрес)"
  phone: "+7 (000) 000-00-00"
  website: ""
  # Ссылка на политику обработки персональных данных клиники (обязательна по 152-ФЗ).
  privacy_policy_url: "https://example.com/privacy"
  # Кто оператор персональных данных — юрлицо или ИП клиники.
  operator: "ООО «Пример» (замените), ИНН 0000000000"
  # Необязательно: свой текст согласия (согласуйте с юристом). Если пусто — бот покажет стандартный.
  consent_text: ""

assistant:
  name: "Анна"
  tone: "вежливо, спокойно и коротко, обращайся на «вы»"
  greeting: >-
    Здравствуйте! Я Анна, виртуальный администратор стоматологии «Пример».
    Отвечу на вопросы и запишу вас на приём. Напишите вопрос или нажмите «📅 Записаться».
  # Особые правила для этой ниши — дописываются к общим правилам бота.
  rules:
    - "Ты не врач: не ставь диагнозы, не назначай лечение и лекарства — предлагай консультацию врача."
    - "При острой боли, отёке, температуре или кровотечении предложи ближайшее свободное время и дай телефон клиники; при угрозе жизни — звонить 103 или 112."
    - "Не спрашивай о симптомах и диагнозах подробно: сведения о здоровье — особая категория персональных данных."
    - "Не называй цены, которых нет в списке услуг: скажи, что точную стоимость назовёт врач после осмотра."

booking:
  # Дополнительный вопрос перед записью. Для клиники оставляем пустым:
  # жалобы и симптомы — это данные о здоровье (ст. 10 152-ФЗ), их лучше не собирать в мессенджере.
  comment_prompt: ""

schedule:
  timezone: "Europe/Moscow"     # Краснодар живёт по московскому времени
  slot_step_minutes: 30         # шаг сетки записи
  booking_horizon_days: 14      # на сколько дней вперёд открыта запись
  min_lead_minutes: 60          # не раньше чем через час от текущего момента
  capacity: 1                   # сколько пациентов можно принять одновременно (кресел/врачей)
  working_hours:
    mon: "09:00-20:00"
    tue: "09:00-20:00"
    wed: "09:00-20:00"
    thu: "09:00-20:00"
    fri: "09:00-20:00"
    sat: "10:00-16:00"
    sun: null                   # выходной
  breaks:
    - "14:00-14:30"
  days_off:                     # праздники и нерабочие даты
    - "2026-12-31"
    - "2027-01-01"
    - "2027-01-02"

# id — латиницей (используется внутри бота). price — как показывать клиенту;
# если оставить пустым, бот скажет «стоимость уточняет администратор».
services:
  - id: consultation
    name: "Консультация стоматолога"
    duration_minutes: 30
    price: ""                   # например: "1 000 ₽"
    description: "Осмотр и план лечения."
  - id: hygiene
    name: "Профессиональная гигиена полости рта"
    duration_minutes: 60
    price: ""
  - id: caries
    name: "Лечение кариеса"
    duration_minutes: 60
    price: ""
    description: "Точный объём работ врач определит на приёме."
  - id: extraction
    name: "Удаление зуба"
    duration_minutes: 45
    price: ""
  - id: kids
    name: "Детский приём"
    duration_minutes: 30
    price: ""

faq:
  - q: "Нужно ли что-то брать с собой?"
    a: "Паспорт; если есть — снимки и выписки от других врачей. (Замените на правила вашей клиники.)"
  - q: "Можно ли прийти с ребёнком?"
    a: "Да, есть детский приём. Ребёнка до 15 лет сопровождает родитель или законный представитель."
  - q: "Как отменить или перенести запись?"
    a: "Нажмите «🗓 Мои записи» и отмените запись, затем запишитесь на новое время. Или позвоните в клинику."
  - q: "Какие способы оплаты?"
    a: "ЗАМЕНИТЕ: перечислите способы оплаты вашей клиники."

knowledge: |
  ЗАМЕНИТЕ этот блок своими данными: как добраться, парковка, рассрочка,
  налоговый вычет, лицензия, гарантия на работы и т. п. Пишите обычным текстом —
  бот будет отвечать по нему и не будет придумывать то, чего здесь нет.
