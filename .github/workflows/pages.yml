name: Deploy homestaging to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "homestaging/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests (calculator)
        run: node --test homestaging/tests/calc-core.test.js

      - name: Assemble _site (only public files)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp homestaging/index.html _site/
          cp -R homestaging/site homestaging/calc homestaging/shared _site/
          if [ -d homestaging/checklist ]; then cp -R homestaging/checklist _site/; fi
          # служебные файлы на сайт не публикуем
          find _site -name "README.md" -delete
          touch _site/.nojekyll
          # защита: исследования и тесты не должны попасть в публикацию
          test ! -e _site/research
          test ! -e _site/tests
          echo "Published files:"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
